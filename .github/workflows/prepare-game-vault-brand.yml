name: Prepare GAME VAULT display name on review branch
on:
  push:
    branches: [fix/game-vault-brand-20261028]
permissions:
  contents: write
concurrency:
  group: game-vault-brand-review
  cancel-in-progress: false
jobs:
  brand:
    if: github.repository == 'MarioIK98/xbox-game-vault' && github.ref == 'refs/heads/fix/game-vault-brand-20261028'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Apply bounded public brand corrections and refresh CSP and sharing files
        run: python tools/check_brand.py --apply
      - name: Confirm idempotence and protected inventory
        run: |
          python tools/check_brand.py
          python tools/prepare_security_release.py --check
          python tools/check_search.py --reference 6549819565f0ee2c9f73bcc978578671d17165ed --out verification/brand-search.json
          python tools/check_hosting.py --out verification/hosting.json
          git diff --check
      - name: Save only reviewed generated public files to feature branch
        run: |
          git add -- index.html oeffentlich tools/prepare_security_release.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply validated GAME VAULT branding across public pages'
            git push origin HEAD:fix/game-vault-brand-20261028
          fi
