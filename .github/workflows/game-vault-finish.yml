name: Game Vault quality and discovery
on:
  push:
    branches: [main, fix/reach-security-20261028]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: game-vault-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check declared release purpose and hosting readiness first
        run: python tools/check_hosting.py --out verification/hosting.json
      - name: Install existing pinned browser-test toolchain
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Detect stale CSP hashes or public sharing files
        run: python tools/prepare_security_release.py --check
      - name: Check canonical pages and search metadata
        run: python tools/check_search.py --out verification/search.json
      - name: Buyer-flow, HTTP and offline regression tests
        run: python tools/test_game_vault.py --out verification/browser
      - name: Isolated browser security and input-validation tests
        run: python tools/test_security.py --out verification/security
      - name: Verify sharing controls and honest failure messages
        run: python tools/test_sharing_ui.py --out verification/sharing-ui
      - name: Generate material for approved sharing channels; do not send
        run: python tools/prepare_security_release.py --bundle-out verification/sharing
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: game-vault-quality
          path: verification/
          retention-days: 14
  live-discovery:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Read-only verification of exact public security and sharing files
        run: python tools/verify_public_security.py --out verification/live-security.json
      - name: Verify search metadata and notify only changed canonical URLs
        run: python tools/check_search.py --live --notify-indexnow --changed-only --out verification/live-search.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: game-vault-live-discovery
          path: verification/
          retention-days: 14
