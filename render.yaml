# Preview-only Blueprint. No commercial release or public-domain switch without approval.
services:
  - type: web
    runtime: static
    name: game-vault-preview
    buildCommand: python3 tools/build_hosted_release.py --mode preview --dest dist
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Content-Security-Policy
        value: "frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
      - path: /*
        name: X-Robots-Tag
        value: "noindex, nofollow"
      - path: /*
        name: Cache-Control
        value: "public, max-age=300, must-revalidate"
